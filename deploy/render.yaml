# Render.com blueprint for the PoolForge coordinator.
# Render -> New -> Blueprint -> pick this repo. (Or New -> Web Service -> Docker,
# Dockerfile path: deploy/Dockerfile.) WebSockets work out of the box on Render.
services:
  - type: web
    name: poolforge
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: free            # free tier sleeps after ~15 min idle; first request wakes it (~30 s)
    healthCheckPath: /health
    envVars:
      - key: POOLFORGE_DROP_GRACE_S
        value: "30"
      - key: LOG_LEVEL
        value: INFO
    # The free plan has no persistent disk: rooms/run history reset on every deploy or restart.
    # On a paid plan, uncomment to keep the SQLite database:
    # disk:
    #   name: poolforge-data
    #   mountPath: /app/data
    #   sizeGB: 1
