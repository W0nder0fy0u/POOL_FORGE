<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hosted on PoolForge Edge Node</title>
  <style>
    body {
      background: #0b0f19;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #111827;
      border: 1px solid #1f293d;
      padding: 2.5rem;
      border-radius: 12px;
      text-align: center;
      max-width: 480px;
    }
    h1 { color: #38bdf8; margin-bottom: 0.5rem; }
    p { color: #9ca3af; line-height: 1.6; }
    .badge {
      display: inline-block;
      background: #064e3b;
      color: #34d399;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.8rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚡ PoolForge Edge Hosting</h1>
    <p>This web application is hosted on a student laptop participating in the PoolForge compute cluster.</p>
    <div class="badge">LIVE VIA POOL CLUSTER</div>
  </div>
</body>
</html>
