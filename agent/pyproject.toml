[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poolforge-agent"
version = "0.1.0"
description = "PoolForge distributed worker agent CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "psutil>=5.9.0",
    "websockets>=11.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
]

[project.scripts]
poolforge = "cli:main"
