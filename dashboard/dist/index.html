<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoolForge ⚡ Distributed AI & Compute Pool</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-border: #1f293d;
      --card-hover: #172238;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #06b6d4;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    code, pre { font-family: 'JetBrains Mono', monospace; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    
    .nav {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.85rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .logo-badge {
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
    }
    .nav-tabs {
      display: flex;
      gap: 0.4rem;
    }
    .nav-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .nav-tab:hover {
      color: var(--text);
      background: var(--card-border);
    }
    .nav-tab.active {
      background: #1e293b;
      color: #38bdf8;
      border-color: #38bdf840;
    }
    .room-pill {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #1e293b;
      padding: 0.35rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--card-border);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }
    .status-dot.connected { background: var(--success); box-shadow: 0 0 8px #10b98188; }
    
    .container {
      max-width: 1200px;
      margin: 1.5rem auto;
      padding: 0 1.5rem;
      flex: 1;
      width: 100%;
    }
    
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.15s;
    }
    .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-success { background: #059669; }
    .btn-success:hover { background: #047857; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-secondary { background: #374151; color: #e5e7eb; }
    .btn-secondary:hover { background: #4b5563; }
    
    .grid { display: grid; gap: 1.25rem; }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    .grid-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    
    .kpi-card {
      background: #162032;
      border: 1px solid var(--card-border);
      padding: 1.2rem;
      border-radius: 10px;
    }
    .kpi-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .kpi-value { font-size: 1.75rem; font-weight: 800; margin-top: 0.3rem; color: #fff; }
    
    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-idle { background: #064e3b; color: #34d399; }
    .badge-training { background: #1e3a8a; color: #60a5fa; }
    .badge-hosting { background: #4c1d95; color: #c084fc; }
    .badge-offline { background: #374151; color: #9ca3af; }

    .bar-container {
      width: 100%;
      height: 8px;
      background: #1f293d;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 0.4rem;
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      border-radius: 4px;
      transition: width 0.3s;
    }
    
    .cmd-box {
      background: #0d121f;
      border: 1px solid var(--card-border);
      padding: 0.9rem 1.2rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-top: 0.75rem;
      color: #38bdf8;
    }
    
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-muted); }
    .form-input, .form-select {
      width: 100%;
      background: #0d121f;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-size: 0.875rem;
    }
    .form-input:focus, .form-select:focus { outline: none; border-color: var(--primary); }

    /* SVG Chart */
    .chart-svg {
      width: 100%;
      height: 240px;
      overflow: visible;
    }
    
    .node-split-flow {
      display: flex;
      align-items: center;
      gap: 1rem;
      overflow-x: auto;
      padding: 1rem 0;
    }
    .node-split-box {
      background: #162032;
      border: 1px solid #2563eb66;
      border-radius: 8px;
      padding: 1rem;
      min-width: 220px;
      position: relative;
    }
    .split-arrow {
      font-size: 1.5rem;
      color: #38bdf8;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [activeTab, setActiveTab] = useState("home");
      const [roomCode, setRoomCode] = useState(() => localStorage.getItem("pf_room") || "");
      const [adminToken, setAdminToken] = useState(() => localStorage.getItem("pf_token") || "");
      const [connected, setConnected] = useState(false);
      const [nodes, setNodes] = useState([]);
      const [roomStatus, setRoomStatus] = useState("idle");
      const [metrics, setMetrics] = useState([]);
      const [activeJobId, setActiveJobId] = useState(null);
      const [splitPlan, setSplitPlan] = useState([]);
      const [copySuccess, setCopySuccess] = useState(false);

      // Training form state
      const [modelName, setModelName] = useState("tiny_test");
      const [batchSize, setBatchSize] = useState(16);
      const [epochs, setEpochs] = useState(1);
      const [stepsPerEpoch, setStepsPerEpoch] = useState(10);
      const [learningRate, setLearningRate] = useState(0.05);
      const [microbatches, setMicrobatches] = useState(1);
      const [optimizer, setOptimizer] = useState("sgd");

      // App deploy state
      const [deployedApps, setDeployedApps] = useState([
        { id: "app-1", name: "Status Page", node: "laptop-alpha", port: 3000, url: "http://localhost:3000", status: "running" }
      ]);

      const wsRef = useRef(null);

      // WebSocket listener
      useEffect(() => {
        if (!roomCode) return;
        
        const host = window.location.host || "localhost:8000";
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${protocol}//${host}/ws/dashboard/${roomCode}`;

        function connect() {
          const ws = new WebSocket(wsUrl);
          wsRef.current = ws;

          ws.onopen = () => {
            setConnected(true);
          };

          ws.onmessage = (event) => {
            try {
              const data = JSON.parse(event.data);
              if (data.type === "snapshot") {
                if (data.nodes) setNodes(data.nodes);
                if (data.room) setRoomStatus(data.room.status);
                if (data.active_job) setActiveJobId(data.active_job);
              } else if (data.type === "node_update") {
                setNodes(prev => {
                  const filtered = prev.filter(n => n.node_id !== data.telemetry.node_id);
                  return [...filtered, data.telemetry];
                });
              } else if (data.type === "node_left") {
                setNodes(prev => prev.filter(n => n.node_id !== data.node_id));
              } else if (data.type === "job_started") {
                setActiveJobId(data.job_id);
                setRoomStatus("running");
                if (data.split_plan) setSplitPlan(data.split_plan);
                setMetrics([]);
              } else if (data.type === "job_stopped") {
                setRoomStatus("stopped");
              } else if (data.type === "step_metric") {
                setMetrics(prev => [...prev, data.payload]);
              }
            } catch (err) {
              console.error("WS Parse Error", err);
            }
          };

          ws.onclose = () => {
            setConnected(false);
            setTimeout(connect, 2000);
          };
        }

        connect();

        return () => {
          if (wsRef.current) wsRef.current.close();
        };
      }, [roomCode]);

      // Check URL for /join/XXXX
      useEffect(() => {
        const path = window.location.pathname;
        if (path.startsWith("/join/")) {
          const code = path.split("/join/")[1]?.trim();
          if (code) {
            setRoomCode(code.toUpperCase());
            setActiveTab("join");
          }
        }
      }, []);

      const createRoom = async () => {
        try {
          const res = await fetch("/api/rooms", { method: "POST" });
          const data = await res.json();
          setRoomCode(data.room_code);
          setAdminToken(data.admin_token);
          localStorage.setItem("pf_room", data.room_code);
          localStorage.setItem("pf_token", data.admin_token);
          setActiveTab("room");
        } catch (err) {
          alert("Failed to create room: " + err.message);
        }
      };

      const startTraining = async () => {
        if (!roomCode) return;
        try {
          const res = await fetch(`/api/rooms/${roomCode}/start`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Admin-Token": adminToken
            },
            body: JSON.stringify({
              model_name: modelName,
              batch_size: parseInt(batchSize),
              epochs: parseInt(epochs),
              steps_per_epoch: parseInt(stepsPerEpoch),
              learning_rate: parseFloat(learningRate),
              microbatches: parseInt(microbatches),
              optimizer: optimizer
            })
          });
          const data = await res.json();
          if (!res.ok) {
            alert(data.detail || "Training failed to start");
          } else {
            setSplitPlan(data.split_plan || []);
            setActiveTab("training");
          }
        } catch (err) {
          alert("Error starting training: " + err.message);
        }
      };

      const stopTraining = async () => {
        if (!roomCode) return;
        try {
          await fetch(`/api/rooms/${roomCode}/stop`, {
            method: "POST",
            headers: { "X-Admin-Token": adminToken }
          });
        } catch (err) {
          alert("Error stopping training: " + err.message);
        }
      };

      const copyCommand = (text) => {
        navigator.clipboard.writeText(text);
        setCopySuccess(true);
        setTimeout(() => setCopySuccess(false), 2000);
      };

      const currentHost = window.location.origin || "http://localhost:8000";
      const joinCmd = `poolforge join ${roomCode || "X7K2AB"} --server ${currentHost}`;

      // Calculate KPI metrics
      const latestMetric = metrics[metrics.length - 1] || null;
      const avgStepTime = metrics.length > 0 
        ? Math.round(metrics.reduce((acc, m) => acc + m.step_time_ms, 0) / metrics.length)
        : 0;

      // Render Simple SVG Loss Line Chart
      const renderLossChart = () => {
        if (metrics.length < 2) {
          return (
            <div style={{ height: 200, display: "flex", alignItems: "center", justifyContent: "center", color: "var(--text-dim)" }}>
              Waiting for training steps... ({metrics.length} recorded)
            </div>
          );
        }

        const width = 800;
        const height = 220;
        const padding = 35;

        const maxLoss = Math.max(...metrics.map(m => m.loss)) * 1.05;
        const minLoss = Math.min(...metrics.map(m => m.loss)) * 0.95;
        const lossRange = Math.max(maxLoss - minLoss, 0.001);

        const points = metrics.map((m, idx) => {
          const x = padding + (idx / (metrics.length - 1)) * (width - 2 * padding);
          const y = height - padding - ((m.loss - minLoss) / lossRange) * (height - 2 * padding);
          return `${x},${y}`;
        }).join(" ");

        return (
          <svg className="chart-svg" viewBox={`0 0 ${width} ${height}`}>
            <line x1={padding} y1={height - padding} x2={width - padding} y2={height - padding} stroke="#374151" strokeWidth="1" />
            <line x1={padding} y1={padding} x2={padding} y2={height - padding} stroke="#374151" strokeWidth="1" />
            
            <polyline fill="none" stroke="#38bdf8" strokeWidth="3" points={points} />
            
            {metrics.map((m, idx) => {
              const x = padding + (idx / (metrics.length - 1)) * (width - 2 * padding);
              const y = height - padding - ((m.loss - minLoss) / lossRange) * (height - 2 * padding);
              return (
                <circle key={idx} cx={x} cy={y} r="4" fill="#0284c7" stroke="#fff" strokeWidth="2">
                  <title>{`Step ${m.step}: Loss ${m.loss}`}</title>
                </circle>
              );
            })}
          </svg>
        );
      };

      return (
        <div>
          {/* Navigation */}
          <nav className="nav">
            <div className="logo">
              <span>PoolForge</span>
              <span className="logo-badge">MCA CAPSTONE</span>
            </div>
            
            <div className="nav-tabs">
              <button className={`nav-tab ${activeTab === 'home' ? 'active' : ''}`} onClick={() => setActiveTab('home')}>Home</button>
              <button className={`nav-tab ${activeTab === 'join' ? 'active' : ''}`} onClick={() => setActiveTab('join')}>Join</button>
              <button className={`nav-tab ${activeTab === 'room' ? 'active' : ''}`} onClick={() => setActiveTab('room')}>Nodes ({nodes.length})</button>
              <button className={`nav-tab ${activeTab === 'training' ? 'active' : ''}`} onClick={() => setActiveTab('training')}>Training</button>
              <button className={`nav-tab ${activeTab === 'network' ? 'active' : ''}`} onClick={() => setActiveTab('network')}>Network</button>
              <button className={`nav-tab ${activeTab === 'deploy' ? 'active' : ''}`} onClick={() => setActiveTab('deploy')}>Deploy</button>
              <button className={`nav-tab ${activeTab === 'reports' ? 'active' : ''}`} onClick={() => setActiveTab('reports')}>Reports</button>
            </div>

            <div className="room-pill">
              <div className={`status-dot ${connected ? 'connected' : ''}`}></div>
              <span>{roomCode ? `ROOM: ${roomCode}` : "NO ROOM"}</span>
            </div>
          </nav>

          <main className="container">
            {/* TAB: HOME */}
            {activeTab === "home" && (
              <div>
                <div className="card" style={{ textAlign: "center", padding: "3rem 1.5rem" }}>
                  <h1 style={{ fontSize: "2.4rem", fontWeight: 800, marginBottom: "0.8rem", letterSpacing: "-0.03em" }}>
                    Pool spare laptops' RAM & compute.
                  </h1>
                  <p style={{ color: "var(--text-muted)", fontSize: "1.1rem", maxWidth: 640, margin: "0 auto 2rem" }}>
                    Split AI models by layers across distributed laptops behind home Wi-Fi networks. Zero port forwarding, transparent memory aggregation.
                  </p>
                  <div>
                    <button className="btn" style={{ fontSize: "1rem", padding: "0.8rem 1.8rem" }} onClick={createRoom}>
                      ⚡ Create New Pool
                    </button>
                  </div>
                </div>

                <div className="grid grid-2">
                  <div className="card">
                    <h3 className="card-title">How It Works</h3>
                    <ul style={{ paddingLeft: "1.2rem", color: "var(--text-muted)", lineHeight: "1.8" }}>
                      <li><strong>Pipeline Parallelism:</strong> Model layers are partitioned across nodes.</li>
                      <li><strong>Outbound WebSockets:</strong> Worker laptops connect OUTBOUND to coordinator. Works on home Wi-Fi!</li>
                      <li><strong>Autograd Relay:</strong> Activations stream forward, gradients stream backward.</li>
                      <li><strong>Memory Scaling:</strong> Train models exceeding any single laptop's physical RAM.</li>
                    </ul>
                  </div>
                  <div className="card">
                    <h3 className="card-title">Quick Viva Demo Command</h3>
                    <p style={{ color: "var(--text-muted)", fontSize: "0.875rem" }}>
                      Simulate 2 laptops with capped RAM on this local machine:
                    </p>
                    <div className="cmd-box">
                      <code>bash scripts/dev_two_agents.sh</code>
                      <button className="btn btn-secondary" style={{ padding: "0.3rem 0.6rem" }} onClick={() => copyCommand("bash scripts/dev_two_agents.sh")}>
                        {copySuccess ? "Copied!" : "Copy"}
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: JOIN */}
            {activeTab === "join" && (
              <div className="card">
                <h2 className="card-title">Join Existing Pool</h2>
                <p style={{ color: "var(--text-muted)", marginBottom: "1.2rem" }}>
                  Run this single command on your friend's laptop or another terminal. It connects outbound without requiring VPNs or router port-forwarding.
                </p>

                <div className="cmd-box" style={{ fontSize: "1rem", padding: "1.2rem" }}>
                  <code>{joinCmd}</code>
                  <button className="btn btn-secondary" onClick={() => copyCommand(joinCmd)}>
                    {copySuccess ? "Copied!" : "Copy Command"}
                  </button>
                </div>

                <div style={{ marginTop: "1.5rem", background: "#162032", padding: "1rem", borderRadius: "8px" }}>
                  <h4 style={{ fontSize: "0.9rem", color: "#38bdf8", marginBottom: "0.4rem" }}>Options & Flags:</h4>
                  <ul style={{ paddingLeft: "1.2rem", fontSize: "0.85rem", color: "var(--text-muted)", lineHeight: "1.6" }}>
                    <li><code>--ram-cap-gb 1.0</code>: Simulates a smaller laptop with 1 GB RAM cap.</li>
                    <li><code>--transport tcp</code>: Uses raw peer-to-peer TCP on LAN/Tailscale for lower latency.</li>
                    <li><code>--simulate-latency-ms 50</code>: Injects artificial network latency to demonstrate trade-offs.</li>
                  </ul>
                </div>
              </div>
            )}

            {/* TAB: ROOM / NODES */}
            {activeTab === "room" && (
              <div>
                <div className="card-title" style={{ marginBottom: "1rem" }}>
                  <span>Connected Worker Nodes ({nodes.length})</span>
                  <button className="btn btn-secondary" onClick={() => setActiveTab("join")}>+ Add Node</button>
                </div>

                {nodes.length === 0 ? (
                  <div className="card" style={{ textAlign: "center", padding: "3rem" }}>
                    <p style={{ color: "var(--text-muted)" }}>No worker nodes connected yet to room <strong>{roomCode}</strong>.</p>
                    <p style={{ marginTop: "0.5rem", fontSize: "0.875rem" }}>Run the join command to connect a laptop.</p>
                  </div>
                ) : (
                  <div className="grid grid-2">
                    {nodes.map(n => (
                      <div className="card" key={n.node_id}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                          <div>
                            <h3 style={{ fontSize: "1.1rem" }}>{n.node_id}</h3>
                            <span style={{ fontSize: "0.8rem", color: "var(--text-muted)" }}>{n.hostname} ({n.os_name})</span>
                          </div>
                          <span className={`badge badge-${n.status}`}>{n.status.toUpperCase()}</span>
                        </div>

                        <div style={{ marginTop: "1rem" }}>
                          <div style={{ display: "flex", justifyContent: "space-between", fontSize: "0.8rem" }}>
                            <span>Free RAM: {n.ram_free_gb} GB</span>
                            <span>Total: {n.ram_total_gb} GB</span>
                          </div>
                          <div className="bar-container">
                            <div className="bar-fill" style={{ width: `${Math.min(100, (n.ram_free_gb / n.ram_total_gb) * 100)}%` }}></div>
                          </div>
                        </div>

                        <div style={{ marginTop: "0.8rem" }}>
                          <div style={{ display: "flex", justifyContent: "space-between", fontSize: "0.8rem" }}>
                            <span>CPU Usage</span>
                            <span>{n.cpu_percent}%</span>
                          </div>
                          <div className="bar-container">
                            <div className="bar-fill" style={{ width: `${n.cpu_percent}%`, background: "linear-gradient(90deg, #10b981, #f59e0b)" }}></div>
                          </div>
                        </div>

                        <div style={{ marginTop: "0.8rem", fontSize: "0.8rem", color: "var(--text-muted)" }}>
                          Transport: <strong>{n.transport_type.toUpperCase()}</strong>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB: TRAINING */}
            {activeTab === "training" && (
              <div>
                <div className="grid grid-4" style={{ marginBottom: "1.5rem" }}>
                  <div className="kpi-card">
                    <div className="kpi-label">Current Step</div>
                    <div className="kpi-value">{latestMetric ? latestMetric.step : 0}</div>
                  </div>
                  <div className="kpi-card">
                    <div className="kpi-label">Current Loss</div>
                    <div className="kpi-value" style={{ color: "#38bdf8" }}>{latestMetric ? latestMetric.loss : "--"}</div>
                  </div>
                  <div className="kpi-card">
                    <div className="kpi-label">Avg Step Time</div>
                    <div className="kpi-value">{avgStepTime} ms</div>
                  </div>
                  <div className="kpi-card">
                    <div className="kpi-label">Throughput</div>
                    <div className="kpi-value">{latestMetric ? latestMetric.throughput_samples_sec : 0} <span style={{ fontSize: "0.9rem" }}>s/s</span></div>
                  </div>
                </div>

                <div className="card">
                  <div className="card-title">
                    <span>Live Convergence Curve</span>
                    <div style={{ display: "flex", gap: "0.5rem" }}>
                      <button className="btn btn-success" onClick={startTraining}>▶ Start Training</button>
                      <button className="btn btn-danger" onClick={stopTraining}>⏹ Stop</button>
                    </div>
                  </div>
                  {renderLossChart()}
                </div>

                <div className="card">
                  <h3 className="card-title">Pipeline Partitioning Plan</h3>
                  {splitPlan.length === 0 ? (
                    <p style={{ color: "var(--text-muted)", fontSize: "0.875rem" }}>Start training to view contiguous layer allocations per node.</p>
                  ) : (
                    <div className="node-split-flow">
                      {splitPlan.map((p, idx) => (
                        <React.Fragment key={p.node_id}>
                          <div className="node-split-box">
                            <h4 style={{ color: "#38bdf8" }}>Stage {p.stage_index}: {p.node_id}</h4>
                            <div style={{ fontSize: "0.85rem", marginTop: "0.4rem" }}>
                              <div>Layers: <strong>[{p.start_layer}, {p.end_layer})</strong> ({p.num_layers} layers)</div>
                              <div>Est. Memory: <strong>{p.estimated_ram_mb} MB</strong></div>
                              <div>Node RAM Cap: <strong>{p.node_ram_cap_gb} GB</strong></div>
                            </div>
                          </div>
                          {idx < splitPlan.length - 1 && <span className="split-arrow">➔</span>}
                        </React.Fragment>
                      ))}
                    </div>
                  )}
                </div>

                <div className="card">
                  <h3 className="card-title">Training Configuration</h3>
                  <div className="grid grid-2">
                    <div className="form-group">
                      <label className="form-label">Model Architecture</label>
                      <select className="form-select" value={modelName} onChange={e => setModelName(e.target.value)}>
                        <option value="tiny_test">tiny_test (Fast Verification MLP)</option>
                        <option value="mnist_mlp">mnist_mlp (MNIST Multi-Layer Perceptron)</option>
                        <option value="mnist_cnn">mnist_cnn (MNIST Convolutional Neural Network)</option>
                        <option value="large_mlp">large_mlp (Memory-Heavy Cap Exceeding Model)</option>
                      </select>
                    </div>
                    <div className="form-group">
                      <label className="form-label">Batch Size</label>
                      <input className="form-input" type="number" value={batchSize} onChange={e => setBatchSize(e.target.value)} />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Steps Per Epoch</label>
                      <input className="form-input" type="number" value={stepsPerEpoch} onChange={e => setStepsPerEpoch(e.target.value)} />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Learning Rate</label>
                      <input className="form-input" type="number" step="0.01" value={learningRate} onChange={e => setLearningRate(e.target.value)} />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Microbatches (Latency-Hiding)</label>
                      <select className="form-select" value={microbatches} onChange={e => setMicrobatches(e.target.value)}>
                        <option value="1">1 (Standard Mini-batch)</option>
                        <option value="2">2 Micro-batches</option>
                        <option value="4">4 Micro-batches</option>
                      </select>
                    </div>
                    <div className="form-group">
                      <label className="form-label">Optimizer</label>
                      <select className="form-select" value={optimizer} onChange={e => setOptimizer(e.target.value)}>
                        <option value="sgd">SGD (Stochastic Gradient Descent)</option>
                        <option value="adam">Adam (Adaptive Moments)</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: NETWORK */}
            {activeTab === "network" && (
              <div>
                <div className="grid grid-2">
                  <div className="card">
                    <h3 className="card-title">Transport Data Plane Telemetry</h3>
                    <div style={{ lineHeight: "2", fontSize: "0.9rem" }}>
                      <div>Current Mode: <strong>Relay (WebSocket Frames via Coordinator)</strong></div>
                      <div>NAT Traversal: <span style={{ color: "#34d399" }}>Active (Zero router configuration)</span></div>
                      <div>Avg Network Latency: <strong>{latestMetric ? latestMetric.network_latency_ms : 0} ms</strong></div>
                      <div>Wire Overhead: <strong>4-byte uint32 length + JSON header</strong></div>
                    </div>
                  </div>
                  <div className="card">
                    <h3 className="card-title">Transport Comparison (Viva Explanation)</h3>
                    <div style={{ fontSize: "0.875rem", color: "var(--text-muted)", lineHeight: "1.6" }}>
                      <p><strong>RelayTransport:</strong> Outbound WebSocket routing. Ideal for WAN and home Wi-Fi where inbound ports are blocked by NAT.</p>
                      <p style={{ marginTop: "0.6rem" }}><strong>DirectTCPTransport:</strong> Raw TCP peer sockets. Delivers lower step time on local LAN or Tailscale.</p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: DEPLOY */}
            {activeTab === "deploy" && (
              <div className="card">
                <h3 className="card-title">Distributed App Hosting</h3>
                <p style={{ color: "var(--text-muted)", marginBottom: "1.2rem", fontSize: "0.9rem" }}>
                  Deploy lightweight web services across cluster nodes with optional Cloudflare quick tunnels.
                </p>

                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "0.9rem" }}>
                  <thead>
                    <tr style={{ borderBottom: "1px solid var(--card-border)", textAlign: "left", color: "var(--text-muted)" }}>
                      <th style={{ padding: "0.6rem" }}>App Name</th>
                      <th style={{ padding: "0.6rem" }}>Node</th>
                      <th style={{ padding: "0.6rem" }}>Port</th>
                      <th style={{ padding: "0.6rem" }}>URL</th>
                      <th style={{ padding: "0.6rem" }}>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    {deployedApps.map(a => (
                      <tr key={a.id} style={{ borderBottom: "1px solid #1f293d" }}>
                        <td style={{ padding: "0.8rem 0.6rem", fontWeight: 600 }}>{a.name}</td>
                        <td style={{ padding: "0.8rem 0.6rem" }}>{a.node}</td>
                        <td style={{ padding: "0.8rem 0.6rem" }}>{a.port}</td>
                        <td style={{ padding: "0.8rem 0.6rem" }}><a href={a.url} target="_blank">{a.url}</a></td>
                        <td style={{ padding: "0.8rem 0.6rem" }}><span className="badge badge-idle">{a.status}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {/* TAB: REPORTS */}
            {activeTab === "reports" && (
              <div className="card">
                <h3 className="card-title">Run Telemetry & Export</h3>
                <p style={{ color: "var(--text-muted)", marginBottom: "1.2rem", fontSize: "0.9rem" }}>
                  Export recorded training step metrics for scientific analysis and viva presentation.
                </p>
                <div style={{ display: "flex", gap: "0.75rem" }}>
                  <button className="btn btn-secondary" onClick={() => {
                    const csv = "step,loss,step_time_ms,throughput\n" + metrics.map(m => `${m.step},${m.loss},${m.step_time_ms},${m.throughput_samples_sec}`).join("\n");
                    const blob = new Blob([csv], { type: "text/csv" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `poolforge_${roomCode}_metrics.csv`;
                    a.click();
                  }}>Export CSV</button>
                  <button className="btn btn-secondary" onClick={() => {
                    const blob = new Blob([JSON.stringify(metrics, null, 2)], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `poolforge_${roomCode}_metrics.json`;
                    a.click();
                  }}>Export JSON</button>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
